# Run from the repository root using the networking, key, and role from benchmark/aws/stack.yaml.
# python benchmark/generate.py --image "$(cat benchmark/aws/image.txt)"
# uv run --project benchmark --extra ec2 harbor run -c benchmark/job.yaml -c benchmark/aws.yaml
# Each trial gets a fresh worker; Harbor terminates it during cleanup.
n_concurrent_trials: 52
environment:
  type: ec2
  import_path: agent_wow_benchmark:EC2Environment
  delete: true
  kwargs:
    region: us-west-2
    launch_mode: ephemeral
    ami_id: ami-08cf17e3856f70154
    instance_type: m6a.xlarge
    subnet_id: subnet-0152e3bad6f549262
    security_group_ids: [sg-0af8375efedea24b8]
    key_name: agent-wow-harbor
    iam_instance_profile: arn:aws:iam::143551238491:instance-profile/agent-wow-harbor-WorkerProfile-VCgqzG7uzDGm
    root_volume_size_gb: 100
    ssh_user: ubuntu
    ssh_key_path: benchmark/aws/worker.pem
    bootstrap_docker: false
    compose_up_timeout_sec: 1800
    user_data: |
      #cloud-config
      package_update: true
      packages:
        - docker.io
        - docker-buildx
        - docker-compose-v2
        - amazon-ecr-credential-helper
      write_files:
        - path: /home/ubuntu/.docker/config.json
          defer: true
          owner: ubuntu:ubuntu
          permissions: '0600'
          content: |
            {"credHelpers":{"143551238491.dkr.ecr.us-west-2.amazonaws.com":"ecr-login"}}
        - path: /root/.docker/config.json
          permissions: '0600'
          content: |
            {"credHelpers":{"143551238491.dkr.ecr.us-west-2.amazonaws.com":"ecr-login"}}
      runcmd:
        - [usermod, -aG, docker, ubuntu]
        - [systemctl, enable, --now, docker]
