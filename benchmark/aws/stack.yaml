AWSTemplateFormatVersion: "2010-09-09"
Description: Supporting resources for Harbor's ephemeral EC2 workers.
Parameters:
  VpcId:
    Type: AWS::EC2::VPC::Id
  SshCidr:
    Type: String
    Description: Controller's public IPv4 address followed by /32.
    AllowedPattern: '(\d{1,3}\.){3}\d{1,3}/32'
  ViewerWorldRepositoryArn:
    Type: String
    Default: ""
    Description: ECR repository for the existing mod-watch world image. Set to enable spectator sessions.
Conditions:
  ViewerEnabled: !Not [!Equals [!Ref ViewerWorldRepositoryArn, ""]]
Resources:
  Images:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: !Ref AWS::StackName
      ImageTagMutability: IMMUTABLE
      EncryptionConfiguration:
        EncryptionType: AES256
  WorkerRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: {Service: ec2.amazonaws.com}
            Action: sts:AssumeRole
      ManagedPolicyArns: !If
        - ViewerEnabled
        - [!Sub 'arn:${AWS::Partition}:iam::aws:policy/AmazonSSMManagedInstanceCore']
        - !Ref AWS::NoValue
      Policies:
        - PolicyName: PullWorkerImage
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: "*"
              - Effect: Allow
                Action: [ecr:BatchGetImage, ecr:GetDownloadUrlForLayer, ecr:BatchCheckLayerAvailability]
                Resource:
                  - !GetAtt Images.Arn
                  - !If [ViewerEnabled, !Ref ViewerWorldRepositoryArn, !Ref 'AWS::NoValue']
  WorkerProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles: [!Ref WorkerRole]
  WorkerKey:
    Type: AWS::EC2::KeyPair
    Properties:
      KeyName: !Ref AWS::StackName
      KeyType: ed25519
  WorkerNetwork:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: SSH from the Harbor controller; game ports stay inside Docker.
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: !Ref SshCidr
Outputs:
  Repository:
    Value: !GetAtt Images.RepositoryUri
  KeyPairId:
    Value: !GetAtt WorkerKey.KeyPairId
