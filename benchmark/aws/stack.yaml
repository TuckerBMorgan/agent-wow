AWSTemplateFormatVersion: "2010-09-09"
Description: One Docker worker for Harbor's built-in EC2 backend.
Parameters:
  VpcId:
    Type: AWS::EC2::VPC::Id
  SubnetId:
    Type: AWS::EC2::Subnet::Id
  SshCidr:
    Type: String
    Description: Controller's public IPv4 address followed by /32.
    AllowedPattern: '(\d{1,3}\.){3}\d{1,3}/32'
  AmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/canonical/ubuntu/server/24.04/stable/current/amd64/hvm/ebs-gp3/ami-id
  InstanceType:
    Type: String
    Default: m6i.2xlarge
Resources:
  Images:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: !Ref AWS::StackName
      ImageTagMutability: IMMUTABLE
      EncryptionConfiguration:
        EncryptionType: AES256
  WorkerRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: {Service: ec2.amazonaws.com}
            Action: sts:AssumeRole
      Policies:
        - PolicyName: PullWorkerImage
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: "*"
              - Effect: Allow
                Action: [ecr:BatchGetImage, ecr:GetDownloadUrlForLayer, ecr:BatchCheckLayerAvailability]
                Resource: !GetAtt Images.Arn
  WorkerProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles: [!Ref WorkerRole]
  WorkerKey:
    Type: AWS::EC2::KeyPair
    Properties:
      KeyName: !Ref AWS::StackName
      KeyType: ed25519
  WorkerNetwork:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: SSH from the Harbor controller; game ports stay inside Docker.
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: !Ref SshCidr
  Worker:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref AmiId
      InstanceType: !Ref InstanceType
      KeyName: !Ref WorkerKey
      IamInstanceProfile: !Ref WorkerProfile
      NetworkInterfaces:
        - DeviceIndex: "0"
          AssociatePublicIpAddress: true
          SubnetId: !Ref SubnetId
          GroupSet: [!Ref WorkerNetwork]
      MetadataOptions:
        HttpTokens: required
        HttpPutResponseHopLimit: 1
      BlockDeviceMappings:
        - DeviceName: /dev/sda1
          Ebs:
            VolumeSize: 100
            VolumeType: gp3
            Encrypted: true
            DeleteOnTermination: true
      Tags:
        - {Key: Name, Value: !Ref AWS::StackName}
        - {Key: harbor:environment, Value: ec2}
      UserData:
        Fn::Base64: !Sub |
          #cloud-config
          package_update: true
          packages:
            - docker.io
            - docker-buildx
            - docker-compose-v2
            - amazon-ecr-credential-helper
          write_files:
            - path: /home/ubuntu/.docker/config.json
              defer: true
              owner: ubuntu:ubuntu
              permissions: '0600'
              content: |
                {"credHelpers":{"${AWS::AccountId}.dkr.ecr.${AWS::Region}.${AWS::URLSuffix}":"ecr-login"}}
            - path: /root/.docker/config.json
              permissions: '0600'
              content: |
                {"credHelpers":{"${AWS::AccountId}.dkr.ecr.${AWS::Region}.${AWS::URLSuffix}":"ecr-login"}}
          runcmd:
            - [usermod, -aG, docker, ubuntu]
            - [systemctl, enable, --now, docker]
Outputs:
  InstanceId:
    Value: !Ref Worker
  Repository:
    Value: !GetAtt Images.RepositoryUri
  KeyPairId:
    Value: !GetAtt WorkerKey.KeyPairId
