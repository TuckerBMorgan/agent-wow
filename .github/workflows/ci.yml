name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check and build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            printf 'Run gofmt on these files:\n%s\n' "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race -count=1 -timeout=5m ./...

      - name: Build
        run: ./run build

      - name: Set up uv
        uses: astral-sh/setup-uv@v7

      - name: Check Harbor tasks and scoring
        run: |
          uv run --project benchmark python -m unittest discover -s benchmark -v
          uv run --project benchmark python benchmark/generate.py
          # The agent builds gameplay modules with its own nested Docker engine.
          uv run --project benchmark harbor lint benchmark/tasks/* --ignore compose-privileged
