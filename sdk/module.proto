syntax = "proto3";
package agentwow.gameplay.v1;
import "api/module/v1/session.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/struct.proto";

service Gameplay {
  rpc Execute(google.protobuf.Struct) returns (google.protobuf.Struct);
  rpc OnPacket(agentwow.module.v1.WorldPacket) returns (google.protobuf.Empty);
  rpc BeforeLogout(google.protobuf.Empty) returns (google.protobuf.Empty);
}
