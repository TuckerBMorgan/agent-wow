  MSG_MOVE_STOP_PITCH: /agentwow.duel.v1.Duel/OnPacket
  MSG_MOVE_SET_FACING: /agentwow.duel.v1.Duel/OnPacket
  MSG_MOVE_HEARTBEAT: /agentwow.duel.v1.Duel/OnPacket
  SMSG_INITIAL_SPELLS: /agentwow.duel.v1.Duel/OnPacket
